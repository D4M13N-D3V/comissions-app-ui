name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build & publish (e.g. 1.0.0). Defaults to the latest GitHub release.'
        required: false
        type: string

# Avoid overlapping releases; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Image lives under the repo owner's namespace so the built-in GITHUB_TOKEN
  # can push it. Must stay lowercase (GHCR rejects uppercase references).
  # Point ArgoCD at this path.
  IMAGE: ghcr.io/d4m13n-d3v/comissions-app-ui

jobs:
  release:
    name: Semantic release
    # Only run semantic-release on pushes to main; workflow_dispatch is for
    # (re)publishing an already-released version's image.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags, releases, and push the changelog commit
      issues: write # semantic-release success comments
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Build, scan & publish image
    needs: release
    # Run when a new version was just released, OR on a manual dispatch
    # (always() lets this evaluate even though `release` is skipped on dispatch).
    if: >-
      always() &&
      (needs.release.outputs.new_release_published == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.inputs.version || needs.release.outputs.new_release_version }}"
          if [ -z "$version" ]; then
            version="$(gh release view --json tagName --jq '.tagName')"
          fi
          version="${version#v}" # strip any leading v
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing ${{ env.IMAGE }} at v$version"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Immutable, scanned, versioned tags. `latest` is owned by ci.yml
          # (the rolling main image ArgoCD tracks), so it's intentionally not set here.
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.vars.outputs.version }}
            type=sha,format=short

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: ${{ env.IMAGE }}:scan
          # NEXT_PUBLIC_API_URL is intentionally NOT passed: the Dockerfile bakes a
          # placeholder that docker-entrypoint.sh rewrites to the runtime value, so
          # the image is portable across environments (set NEXT_PUBLIC_API_URL at deploy).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1' # fail the release if a fixable HIGH/CRITICAL is found

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_API_URL is intentionally NOT passed: the Dockerfile bakes a
          # placeholder that docker-entrypoint.sh rewrites to the runtime value, so
          # the image is portable across environments (set NEXT_PUBLIC_API_URL at deploy).
          cache-from: type=gha
          cache-to: type=gha,mode=max
