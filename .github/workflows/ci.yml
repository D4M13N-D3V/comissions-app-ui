name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint
        # Call next lint directly: the `lint` npm script also runs
        # `prettier --check .`, which isn't a CI gate.

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker-build:
    name: Docker image build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR on main
    env:
      IMAGE: ghcr.io/d4m13n-d3v/comissions-app-ui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we're going to push (pushes happen on main, not PRs).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # PRs: build only (push:false, load for any later steps).
      # main: push the rolling deploy image (:latest + :sha-xxxx) that ArgoCD tracks.
      - name: Build${{ github.event_name == 'push' && ' & push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_API_URL is intentionally NOT passed: the Dockerfile bakes a
          # placeholder that docker-entrypoint.sh rewrites to the runtime value, so
          # the image is portable across environments (set NEXT_PUBLIC_API_URL at deploy).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-fs:
    name: Trivy filesystem scan (report)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (vuln, secret, misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
        # Report-only: a dependency CVE shouldn't block PRs. The release
        # job gates on the (pruned) image scan instead.

      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
